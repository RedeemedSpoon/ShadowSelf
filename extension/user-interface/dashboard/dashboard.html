<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShadowSelf identities</title>
    <link rel="icon" href="../../assets/favicon.ico" />
    <link rel="stylesheet" href="../global.css" />
    <link rel="stylesheet" href="./dashboard.css" />
  </head>
  <body>
    <header>
      <img src="../../assets/logo-beside.svg" alt="ShadowSelf" width="150" />
      <span class="eyebrow">Browser companion</span>
    </header>
    <main>
      <section aria-labelledby="connection-title" id="connection">
        <p class="eyebrow">Account connection</p>
        <h1 id="connection-title">Choose your signed-in tab</h1>
        <p>Connect this window to an account using its existing tab session.</p>
        <label for="account-tab">ShadowSelf tab</label>
        <select id="account-tab">
          <option value="">Finding tabs…</option>
        </select>
        <div class="actions">
          <button id="connect" type="button">Connect account</button>
          <button id="open-dashboard" type="button" class="secondary">Open ShadowSelf</button>
        </div>
      </section>
      <section aria-labelledby="account-title" id="account" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">Connected account</p>
            <h1 id="account-title"></h1>
          </div>
          <button id="disconnect" type="button" class="secondary">Disconnect</button>
        </div>
        <label for="search">Find an identity</label>
        <input type="search" id="search" placeholder="Name or location" autocomplete="off" />
        <div id="identities" class="identities"></div>
        <p id="empty" hidden>No identities yet.</p>
        <button id="refresh" type="button" class="secondary">Refresh identities</button>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <aside aria-labelledby="network-title">
        <span class="status-dot"></span>
        <div>
          <h2 id="network-title">Residential routing</h2>
          <p>Residential routing is unavailable until a provider is configured.</p>
        </div>
      </aside>
    </main>
    <footer>
      <a id="website" target="_blank" rel="noreferrer">Dashboard ↗</a>
    </footer>
    <script type="module" src="./dashboard.js"></script>
  </body>
</html>
