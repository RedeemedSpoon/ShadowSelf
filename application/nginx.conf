events {}

http {
   limit_req_zone $binary_remote_addr zone=api_requests:10m rate=4r/s;
   limit_req_zone $binary_remote_addr zone=auth_requests:10m rate=6r/m;
   limit_req_status 429;
   proxy_buffer_size 16k;
   proxy_buffers 8 16k;
   log_format shadowself '$request_method $uri $status $body_bytes_sent $request_time';
   access_log /var/log/nginx/access.log shadowself;
   add_header X-Content-Type-Options nosniff always;
   add_header Referrer-Policy same-origin always;
   add_header X-Frame-Options DENY always;
   add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $remote_addr;
   proxy_set_header Connection $connection_upgrade;
   proxy_set_header Upgrade $http_upgrade;

   map $http_upgrade $connection_upgrade {
      default upgrade;
      '' close;
   }

   gzip on;
   gzip_vary on;
   gzip_static on;
   gzip_proxied any;
   gzip_comp_level 5;
   gzip_min_length 1024;
   gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

   server {
      listen 80;
      server_name shadowself.io www.shadowself.io;
      location /.well-known/acme-challenge/ { root /var/www/certbot; }
      location / { return 308 https://shadowself.io$request_uri; }
   }

   server {
      listen 443 ssl;
      server_name shadowself.io www.shadowself.io;
      ssl_certificate /etc/letsencrypt/live/shadowself.io/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/shadowself.io/privkey.pem;
      ssl_protocols TLSv1.3 TLSv1.2;
      ssl_prefer_server_ciphers off;
      client_max_body_size 20M;

      if ($host = www.shadowself.io) {
         return 308 https://shadowself.io$request_uri;
      }

      location /.well-known/acme-challenge/ { root /var/www/certbot; }

      error_page 429 = @rate_limited;

      location @rate_limited {
         default_type application/json;
         return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Wait before retrying"}}';
      }

      location ~ ^/api/(auth/|contact$) {
         limit_req zone=auth_requests burst=10 nodelay;
         proxy_pass http://backend:3000;
         proxy_http_version 1.1;
         proxy_read_timeout 90s;
      }

      location /api/ {
         limit_req zone=api_requests burst=60 nodelay;
         proxy_pass http://backend:3000;
         proxy_redirect off;
         proxy_http_version 1.1;
         proxy_read_timeout 90s;
      }

      location / {
         proxy_pass http://frontend:5000;
         proxy_redirect off;
      }
   }

   server {
      listen 8080;
      server_name ~\.onion$;
      client_max_body_size 20M;

      error_page 429 = @rate_limited;

      location @rate_limited {
         default_type application/json;
         return 429 '{"error":{"code":"rate_limited","message":"Too many requests. Wait before retrying"}}';
      }

      location ~ ^/api/(auth/|contact$) {
         limit_req zone=auth_requests burst=10 nodelay;
         proxy_pass http://backend:3000;
         proxy_http_version 1.1;
         proxy_read_timeout 90s;
      }

      location /api/ {
         limit_req zone=api_requests burst=60 nodelay;
         proxy_pass http://backend:3000;
         proxy_redirect off;
         proxy_http_version 1.1;
         proxy_read_timeout 90s;
      }

      location / {
         proxy_pass http://frontend:5000;
         proxy_redirect off;
      }
   }
}
