events {}

http {
   proxy_buffer_size 16k;
   proxy_buffers 8 16k;
   log_format shadowself '$remote_addr - $remote_user [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
   access_log /var/log/nginx/access.log shadowself;
   add_header X-Content-Type-Options nosniff always;
   add_header Referrer-Policy no-referrer always;
   add_header X-Frame-Options DENY always;
   add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
   proxy_set_header Host $host;
   proxy_set_header X-Forwarded-Host $host;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

   gzip on;
   gzip_vary on;
   gzip_static on;
   gzip_proxied any;
   gzip_comp_level 5;
   gzip_min_length 1024;
   gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
   proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=dynamic_cache:10m inactive=60m max_size=1g;

   server {
      listen 80;
      server_name shadowself.io www.shadowself.io;
      location /.well-known/acme-challenge/ { root /var/www/certbot; }
      location / { return 308 https://$host$request_uri; }
   }

   server {
      listen 443 ssl;
      server_name shadowself.io www.shadowself.io;


      ssl_certificate /etc/letsencrypt/live/shadowself.io/fullchain.pem;
      ssl_certificate_key /etc/letsencrypt/live/shadowself.io/privkey.pem;
      ssl_protocols TLSv1.3 TLSv1.2;
      ssl_prefer_server_ciphers off;
      client_max_body_size 20M;

      location /.well-known/acme-challenge/ {
          root /var/www/certbot;
      }

      location / {
         proxy_pass http://frontend:5000;
         proxy_redirect off;
      }

      location ~ ^/(ws-(creation-process|api)|billing/crypto/track-invoice/) {
          proxy_pass http://backend:3000;
          proxy_redirect off;

          proxy_http_version 1.1;
          proxy_set_header Connection "upgrade";
          proxy_set_header Upgrade $http_upgrade;
      }

      location ~ ^/api {
          proxy_pass http://backend:3000;
          proxy_redirect off;
      }

      location ~ ^/webhook-(twilio|stripe) {
          proxy_pass http://backend:3000;
          proxy_redirect off;

          proxy_set_header Host $host;
          proxy_set_header X-Real-IP $remote_addr;
          proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
          proxy_set_header X-Forwarded-Proto $scheme;
      }
   }

   server {
      listen 8080;
      server_name ~\.onion$;

      client_max_body_size 20M;

      location / {
         proxy_pass http://frontend:5000;
         proxy_redirect off;
      }

      location ~ ^/(ws-(creation-process|api)|billing/crypto/track-invoice/) {
          proxy_pass http://backend:3000;
          proxy_redirect off;

          proxy_http_version 1.1;
          proxy_set_header Connection "upgrade";
          proxy_set_header Upgrade $http_upgrade;
      }

      location ~ ^/api {
          proxy_pass http://backend:3000;
          proxy_redirect off;
      }
   }
}
