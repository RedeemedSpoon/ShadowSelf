protocols = imap lmtp
mail_location = maildir:~/Maildir
first_valid_uid = 5000
last_valid_uid = 5000
disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = sql
  args = /etc/dovecot/shadowself-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/shadowself-sql.conf.ext
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
namespace inbox {
  inbox = yes
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
  }
}

ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = <SHADOWSELF_TLS_CERT
ssl_key = <SHADOWSELF_TLS_KEY
postmaster_address = contact@shadowself.io
