name: shadowself

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  nginx:
    build: .
    ports:
      - 80:80
      - 443:443
      - 127.0.0.1:8080:8080
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/log/shadowself/nginx:/var/log/nginx
    depends_on:
      - frontend
      - backend
    restart: always
    logging: *default-logging

  certbot:
    build: ./microservices/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - nginx
    restart: always
    init: true
    logging: *default-logging

  postgres:
    build: ./database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 127.0.0.1:5432:5432
    env_file:
      - ./database/.env
    volumes:
      - data:/var/lib/postgresql
    restart: always
    init: true
    logging: *default-logging

  backend:
    build: ./backend
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - 3000
    env_file:
      - ./backend/.env
      - ./database/.env
    depends_on:
      - postgres
    restart: always
    init: true
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 0.75
    logging: *default-logging

  frontend:
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    build: ./frontend
    expose:
      - 5000
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_URL: http://backend:3000
      ORIGIN: ''
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      - backend
    restart: always
    init: true
    logging: *default-logging

volumes:
  data:
