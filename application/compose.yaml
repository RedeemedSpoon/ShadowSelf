name: shadowself

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  nginx:
    build: .
    ports:
      - 0.0.0.0:80:80
      - 0.0.0.0:443:443
      - 127.0.0.1:8080:8080
    volumes:
      - /var/www/certbot:/var/www/certbot
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/log/shadowself/nginx:/var/log/nginx
      - ./.generated/nginx:/etc/nginx/generated:ro
    env_file:
      - ./.generated/compose.env
    depends_on:
      - frontend
      - backend
    restart: always
    logging: *default-logging

  certbot:
    build: ./microservices/certbot
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - /var/www/certbot:/var/www/certbot
    env_file:
      - ./.generated/compose.env
    environment:
      APP_DOMAINS: ${APP_DOMAINS:?Configure APP_DOMAINS}
      MAIL_HOST: ${MAIL_HOST:?Configure MAIL_HOST}
    depends_on:
      - nginx
    restart: always
    init: true
    logging: *default-logging

  postgres:
    build: ./database
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - 127.0.0.1:5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Configure POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Configure POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Configure POSTGRES_PASSWORD}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?Configure APP_DB_PASSWORD}
      MAIL_DB_PASSWORD: ${MAIL_DB_PASSWORD:?Configure MAIL_DB_PASSWORD}
    volumes:
      - data:/var/lib/postgresql
    restart: always
    init: true
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:3000/health/live').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    expose:
      - 3000
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      APP_ORIGIN: ${APP_ORIGIN:-}
      ONION_ORIGIN: ${ONION_ORIGIN:-}
      SECRET_SAUCE: ${SECRET_SAUCE:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_IMAGE_MODEL: ${GEMINI_IMAGE_MODEL:-}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-}
      EMAIL_CONTACT: ${EMAIL_CONTACT:-}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-}
      EMAIL_BILLING: ${EMAIL_BILLING:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      MONTHLY_PRICE_ID: ${MONTHLY_PRICE_ID:-}
      ANNUALLY_PRICE_ID: ${ANNUALLY_PRICE_ID:-}
      LIFETIME_PRICE_ID: ${LIFETIME_PRICE_ID:-}
      TROCADOR_API_KEY: ${TROCADOR_API_KEY:-}
      BTC_API: ${BTC_API:-}
      BTC_API_FALLBACKS: ${BTC_API_FALLBACKS:-}
      LTC_API: ${LTC_API:-}
      LTC_API_FALLBACKS: ${LTC_API_FALLBACKS:-}
      ETH_API: ${ETH_API:-}
      ETH_API_FALLBACKS: ${ETH_API_FALLBACKS:-}
      ETH_RPC_URLS: ${ETH_RPC_URLS:-}
      XMR_NODE: ${XMR_NODE:-}
      XMR_NODE_FALLBACKS: ${XMR_NODE_FALLBACKS:-}
      MONERO_ADDRESS: ${MONERO_ADDRESS:-}
      MONERO_VIEWKEY: ${MONERO_VIEWKEY:-}
      MONERO_SPENDKEY: ${MONERO_SPENDKEY:-}
      MONERO_RESTORE_HEIGHT: ${MONERO_RESTORE_HEIGHT:-0}
      MONERO_PASSWORD: ${MONERO_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-}
    depends_on:
      - postgres
    restart: always
    init: true
    mem_limit: 768m
    mem_reservation: 256m
    cpus: 0.75
    logging: *default-logging

  frontend:
    healthcheck:
      test:
        [
          'CMD',
          'bun',
          '-e',
          "fetch('http://localhost:5000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        APP_ORIGIN: ${APP_ORIGIN:?Configure APP_ORIGIN}
        ONION_ORIGIN: ${ONION_ORIGIN:-}
        MAIL_DOMAIN: ${MAIL_DOMAIN:?Configure MAIL_DOMAIN}
        PUBLIC_STRIPE_KEY: ${PUBLIC_STRIPE_KEY:-}
        CSP_CONNECT_ORIGINS: ${CSP_CONNECT_ORIGINS:-}
        CSP_SCRIPT_ORIGINS: ${CSP_SCRIPT_ORIGINS:-}
        CSP_FRAME_ORIGINS: ${CSP_FRAME_ORIGINS:-}
    expose:
      - 5000
    environment:
      BACKEND_URL: http://backend:3000
      PUBLIC_STRIPE_KEY: ${PUBLIC_STRIPE_KEY:-}
      ORIGIN: ''
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
    depends_on:
      - backend
    restart: always
    init: true
    logging: *default-logging

volumes:
  data:
