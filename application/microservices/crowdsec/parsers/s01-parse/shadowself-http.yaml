name: shadowself/http-security
description: Parse minimal clearnet HTTP security events
filter: "evt.Line.Labels.type == 'shadowself-http'"
onsuccess: next_stage
grok:
  pattern: '^%{IP:remote_addr} \[%{HTTPDATE:time_local}\] "%{WORD:verb} %{NOTSPACE:request}" %{INT:status}$'
  apply_on: Line.Raw
statics:
  - target: evt.StrTime
    expression: evt.Parsed.time_local
  - meta: log_type
    value: http_access-log
  - meta: service
    value: http
  - meta: source_ip
    expression: evt.Parsed.remote_addr
  - meta: http_status
    expression: evt.Parsed.status
  - meta: http_path
    expression: evt.Parsed.request
  - meta: http_verb
    expression: evt.Parsed.verb
  - meta: target_fqdn
    value: shadowself
