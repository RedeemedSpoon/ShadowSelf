protocols = imap lmtp
mail_location = maildir:~/Maildir
mail_plugins = quota

plugin {
  quota = maildir:Mailbox quota
  quota_rule = *:storage=1G
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
}
first_valid_uid = 5000
last_valid_uid = 5000
disable_plaintext_auth = yes
auth_mechanisms = plain login

passdb {
  driver = sql
  args = /etc/dovecot/shadowself-sql.conf.ext
}
userdb {
  driver = sql
  args = /etc/dovecot/shadowself-sql.conf.ext
}
service lmtp {
  unix_listener /var/spool/postfix/private/dovecot-lmtp {
    mode = 0600
    user = postfix
    group = postfix
  }
}
service auth {
  unix_listener /var/spool/postfix/private/auth {
    mode = 0660
    user = postfix
    group = postfix
  }
}
namespace inbox {
  inbox = yes
  mailbox Sent {
    auto = subscribe
    special_use = \Sent
  }
  mailbox Drafts {
    auto = subscribe
    special_use = \Drafts
  }
  mailbox Junk {
    auto = subscribe
    special_use = \Junk
    autoexpunge = 7d
  }
}

ssl = required
ssl_min_protocol = TLSv1.2
ssl_cert = <__TLS_CERT__
ssl_key = <__TLS_KEY__
postmaster_address = __CONTACT_EMAIL__
